name: Generate steel demand report

on:
  workflow_dispatch:
  schedule:
    # 매일 새벽 4시 KST = 전날 19시 UTC
    - cron: "0 19 * * *"

permissions:
  contents: write

jobs:
  generate-steel-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create folders
        run: |
          mkdir -p data/cache
          mkdir -p data/processed
          mkdir -p data/reference

      - name: Check reference file
        run: |
          test -f data/reference/bjdong_codes_for_archhub.csv

      - name: Update ArchHUB priority cache
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          ARCHHUB_API_KEY: ${{ secrets.ARCHHUB_API_KEY }}
          ARCHHUB_FORCE_REFRESH: "true"
        run: |
          python collect_archhub.py --mode priority --max-per-region 50 --max-pages 1

      - name: Generate integrated Excel report
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          CALS_API_KEY: ${{ secrets.CALS_API_KEY }}
          ARCHHUB_API_KEY: ${{ secrets.ARCHHUB_API_KEY }}

          ARCHHUB_CACHE_HOURS: "9999"
          ARCHHUB_FORCE_REFRESH: "false"

          CALS_CONNECT_TIMEOUT: "30"
          CALS_READ_TIMEOUT: "120"
          CALS_MAX_RETRIES: "5"
          CALS_BACKOFF_SEC: "3"
          CALS_MAX_PAGES: "0"
        run: |
          python integrated_steel_report.py

      - name: Copy latest report to stable filename
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          processed = Path("data/processed")
          files = sorted(
              processed.glob("integrated_steel_demand_report_[0-9]*.xlsx"),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )

          if not files:
              raise FileNotFoundError("timestamp report file not found")

          latest = files[0]
          target = processed / "integrated_steel_demand_report_latest.xlsx"
          shutil.copy2(latest, target)

          print(f"latest report: {latest}")
          print(f"stable report: {target}")
          PY

      - name: Commit latest report and cache
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/processed/integrated_steel_demand_report_latest.xlsx
          git add -f data/cache/archhub_basis_region_summary_latest.csv
          git add -f data/cache/archhub_basis_normalized_latest.csv
          git add -f data/cache/archhub_cache_meta.json

          git diff --cached --quiet || git commit -m "Update latest steel demand report"
          git push
