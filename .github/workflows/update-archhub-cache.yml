name: Update ArchHUB Cache

on:
  workflow_dispatch:
  schedule:
    # 매일 새벽 3시 KST = 전날 18시 UTC
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update-archhub-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create folders
        run: |
          mkdir -p data/cache
          mkdir -p data/reference

      - name: Check reference file
        run: |
          test -f data/reference/bjdong_codes_for_archhub.csv

      - name: Run ArchHUB priority collector
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          ARCHHUB_API_KEY: ${{ secrets.ARCHHUB_API_KEY }}
          ARCHHUB_FORCE_REFRESH: "true"
        run: |
          python collect_archhub.py --mode priority --max-per-region 50 --max-pages 1

      - name: Commit updated cache
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/cache/archhub_basis_region_summary_latest.csv
          git add -f data/cache/archhub_basis_normalized_latest.csv
          git add -f data/cache/archhub_cache_meta.json

          git diff --cached --quiet || git commit -m "Update ArchHUB cache"
          git push
